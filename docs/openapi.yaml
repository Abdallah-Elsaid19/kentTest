components:
  schemas:
    Article:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 180
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 250
        summary:
          type: string
        body:
          type: string
        author:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        categories:
          type: array
          items:
            $ref: '#/components/schemas/ArticleCategory'
          readOnly: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/ArticleTag'
          readOnly: true
        image:
          allOf:
          - $ref: '#/components/schemas/MediaAsset'
          readOnly: true
        is_featured:
          type: boolean
        seo:
          type: object
          additionalProperties: {}
          readOnly: true
        published_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - categories
      - id
      - image
      - seo
      - slug
      - tags
      - title
      - updated_at
    ArticleCategory:
      type: object
      properties:
        slug:
          type: string
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 150
      required:
      - name
      - slug
    ArticleTag:
      type: object
      properties:
        slug:
          type: string
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 150
      required:
      - name
      - slug
    College:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 160
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 200
        summary:
          type: string
        description:
          type: string
        image:
          allOf:
          - $ref: '#/components/schemas/MediaAsset'
          readOnly: true
        sort_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        is_featured:
          type: boolean
        seo:
          type: object
          additionalProperties: {}
          readOnly: true
        published_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - image
      - seo
      - slug
      - title
      - updated_at
    ContactSubmission:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 50
        organisation:
          type: string
          maxLength: 200
        interest:
          type: string
          maxLength: 200
        message:
          type: string
        consent:
          type: boolean
        source_page:
          type: string
          maxLength: 300
        captcha_token:
          type: string
          writeOnly: true
      required:
      - email
      - name
    DeliveryModeEnum:
      enum:
      - online
      - in-person
      - blended
      type: string
      description: |-
        * `online` - Online
        * `in-person` - In person
        * `blended` - Blended
    EligibilitySubmission:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 50
        programme:
          type: integer
          nullable: true
        employment_status:
          type: string
          maxLength: 100
        message:
          type: string
        consent:
          type: boolean
        source_page:
          type: string
          maxLength: 300
        captcha_token:
          type: string
          writeOnly: true
      required:
      - email
      - name
    EmployerAgreementSubmission:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 50
        organisation:
          type: string
          maxLength: 200
        job_title:
          type: string
          maxLength: 200
        employee_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        message:
          type: string
        consent:
          type: boolean
        source_page:
          type: string
          maxLength: 300
        captcha_token:
          type: string
          writeOnly: true
      required:
      - email
      - name
      - organisation
    EventAgenda:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        speaker:
          allOf:
          - $ref: '#/components/schemas/Person'
          readOnly: true
        sort_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - ends_at
      - id
      - speaker
      - starts_at
      - title
    EventCategory:
      type: object
      properties:
        slug:
          type: string
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 150
      required:
      - name
      - slug
    EventDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 180
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 250
        status:
          type: string
          readOnly: true
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        timezone:
          type: string
          readOnly: true
        location:
          type: string
          maxLength: 250
        address:
          type: string
        is_online:
          type: boolean
        booking_url:
          type: string
          format: uri
          maxLength: 200
        categories:
          type: array
          items:
            $ref: '#/components/schemas/EventCategory'
          readOnly: true
        summary:
          type: string
        image:
          allOf:
          - $ref: '#/components/schemas/MediaAsset'
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        description:
          type: string
        speakers:
          type: array
          items:
            $ref: '#/components/schemas/EventSpeaker'
          readOnly: true
        agenda:
          type: array
          items:
            $ref: '#/components/schemas/EventAgenda'
          readOnly: true
        seo:
          type: object
          additionalProperties: {}
          readOnly: true
        published_at:
          type: string
          format: date-time
          nullable: true
      required:
      - agenda
      - categories
      - end_at
      - id
      - image
      - seo
      - slug
      - speakers
      - start_at
      - status
      - timezone
      - title
      - updated_at
    EventList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 180
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 250
        status:
          type: string
          readOnly: true
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        timezone:
          type: string
          readOnly: true
        location:
          type: string
          maxLength: 250
        address:
          type: string
        is_online:
          type: boolean
        booking_url:
          type: string
          format: uri
          maxLength: 200
        categories:
          type: array
          items:
            $ref: '#/components/schemas/EventCategory'
          readOnly: true
        summary:
          type: string
        image:
          allOf:
          - $ref: '#/components/schemas/MediaAsset'
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - categories
      - end_at
      - id
      - image
      - slug
      - start_at
      - status
      - timezone
      - title
      - updated_at
    EventSpeaker:
      type: object
      properties:
        person:
          allOf:
          - $ref: '#/components/schemas/Person'
          readOnly: true
        role:
          type: string
          maxLength: 150
        sort_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - person
    Health:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
      - database
      - status
    LocationEnum:
      enum:
      - header
      - footer
      - utility
      type: string
      description: |-
        * `header` - Header
        * `footer` - Footer
        * `utility` - Utility
    MediaAsset:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          readOnly: true
        alt_text:
          type: string
          maxLength: 250
        caption:
          type: string
        width:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
