map $arg_v $kbc_hero_media_cache {
    "" "public, max-age=0, must-revalidate";
    default "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Versioned hero media can be reused on normal reloads. Nginx retains
    # native byte-range, ETag and Last-Modified handling for video playback.
    location ~ ^/assets/(video/home-hero\.(webm|mp4)|images/figma-home/hero-group\.png)$ {
        try_files $uri =404;
        add_header Cache-Control $kbc_hero_media_cache;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:8000/sitemap.xml;
    }

    location ~ ^/dashboard(?:/.*)?$ {
        try_files $uri /index.html;
    }

    location ~ ^/(api|health|admin|media|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # Only known client routes receive the SPA shell. Unknown paths return a real 404.
    location ~ ^/(|colleges(?:/[^/]+)?|programmes(?:/[^/]+)?|courses(?:/[^/]+)?|events(?:/[^/]+)?|people|our-experts|star-learners|stories(?:/[^/]+)?|apprentices(?:/stories)?|blog(?:/[^/]+)?|contact|support|eligibility|employer-agreement|apply|search|store|cart|checkout|privacy|terms|cookies|book-session|who-we-are|faq|our-partners|governance-board|safeguarding-handbook|explore-jobs|pages/[^/]+)/?$ {
        try_files $uri /index.html;
    }

    location / {
        return 404;
    }
}
