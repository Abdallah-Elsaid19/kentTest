server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /sitemap.xml {
        proxy_pass http://backend:8000/sitemap.xml;
    }

    location ~ ^/(api|health|admin|media|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # Only known client routes receive the SPA shell. Unknown paths return a real 404.
    location ~ ^/(|colleges(?:/[^/]+)?|programmes(?:/[^/]+)?|courses(?:/[^/]+)?|events(?:/[^/]+)?|people|our-experts|star-learners|stories(?:/[^/]+)?|apprentices(?:/stories)?|blog(?:/[^/]+)?|contact|support|eligibility|employer-agreement|apply|search|store|cart|checkout|privacy|terms|cookies|book-session|who-we-are|faq|our-partners|governance-board|safeguarding-handbook|explore-jobs|pages/[^/]+)/?$ {
        try_files $uri /index.html;
    }

    location / {
        return 404;
    }
}
