services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kbc
      POSTGRES_USER: kbc
      POSTGRES_PASSWORD: kbc-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbc -d kbc"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - kbc_postgres:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: local-development-only-change-me
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_URL: postgresql://kbc:kbc-local-only@db:5432/kbc
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_SITE_URL: http://localhost:5173
      VITE_COMMERCE_ENABLED: "false"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  kbc_postgres:
  frontend_node_modules:
