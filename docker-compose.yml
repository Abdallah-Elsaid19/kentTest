services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: local-development-only-change-me
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: https://localhost:5173
      CSRF_TRUSTED_ORIGINS: https://localhost:5173
    # DATABASE_URL comes exclusively from backend/.env and must target Neon.
    # Run migrations explicitly as a release/setup step, never on every restart.
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_SITE_URL: https://localhost:5173
      KBC_API_PROXY_TARGET: http://backend:8000
      VITE_COMMERCE_ENABLED: "false"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - ./backend/apps/cms/home_contract.json:/backend/apps/cms/home_contract.json:ro
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
